name: KSNK Permission Matrix CI
on:
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'supabase/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/permission-matrix-ci.yml'
  push:
    branches:
      - feature/hoan-thien-pptx-quyen-20261123
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
