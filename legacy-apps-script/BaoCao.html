  /* ==========================================================
     V13 - PHÔNG TIÊU ĐỀ BÁO CÁO GIAO BAN 4 TỔ
     ========================================================== */
  .bc-hero{
    --hero-accent:#1f5fbf;
    --hero-dark:#123b8f;
    --hero-light:#eaf2ff;
    position:relative;
    overflow:hidden;
    min-height:315px;
    margin:-6px -6px 24px;
    border-radius:16px;
    border-top:9px solid var(--hero-dark);
    border-bottom:7px solid var(--hero-accent);
    background:
      linear-gradient(
        110deg,
        #ffffff 0%,
        #ffffff 55%,
        var(--hero-light) 55%,
        #ffffff 100%
      );
    box-shadow:0 7px 22px rgba(18,59,143,.15);
  }

  .bc-hero::before{
    content:"";
    position:absolute;
    right:-110px;
    top:-130px;
    width:430px;
    height:430px;
    border-radius:50%;
    background:
      radial-gradient(
        circle,
        rgba(255,255,255,.86) 0 24%,
        transparent 25% 34%,
        rgba(255,255,255,.48) 35% 36%,
        transparent 37%
      );
    opacity:.8;
  }

  .bc-hero::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:11px;
    background:
      linear-gradient(
        90deg,
        var(--hero-dark) 0 64%,
        #e51c23 64% 96%,
        #f0a078 96% 100%
      );
  }

  .bc-hero-inner{
    position:relative;
    z-index:2;
    display:grid;
    grid-template-columns:minmax(0,1.45fr) minmax(320px,.75fr);
    min-height:295px;
  }

  .bc-hero-main{
    padding:24px 30px 34px;
  }

  .bc-hero-brand{
    display:flex;
    align-items:center;
    gap:13px;
    margin-bottom:24px;
  }

  .bc-hero-logo{
    width:58px;
    height:58px;
    border:4px solid var(--hero-accent);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    color:#e32636;
    font-size:18px;
    font-weight:900;
    box-shadow:0 3px 8px rgba(0,0,0,.12);
  }

  .bc-hero-hospital{
    font-family:Georgia,"Times New Roman",serif;
    font-size:19px;
    color:var(--hero-dark);
    font-weight:800;
    line-height:1.15;
  }

  .bc-hero-hospital small{
    display:block;

    font-weight:500;
  }

    border-bottom:3px solid var(--hero-accent);

    font-size:18px;
    font-weight:900;
  }

  .bc-hero-report-title{

    font-weight:950;

  .bc-hero-subtitle{
    margin-top:8px;

  }

    justify-content:center;
  }

  .bc-hero-visual{
    position:relative;
    border:3px solid #fff;
    border-radius:34px 8px 34px 8px;
    background:
      linear-gradient(
        145deg,
        rgba(255,255,255,.95),
        var(--hero-light)
      );
    box-shadow:
      0 10px 24px rgba(0,0,0,.15),

    padding:20px 19px 17px;

    position:absolute;
    right:17px;

    width:74px;

    background:
      linear-gradient(
        135deg,
        var(--hero-accent),
        var(--hero-dark)
      );
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    font-weight:900;
    box-shadow:0 7px 15px rgba(0,0,0,.18);
    transform:rotate(3deg);

  .bc-hero-task-title{

    font-weight:900;
    margin-bottom:10px;

    color:#23334d;
    font-size:12.5px;
    font-weight:650;
    line-height:1.3;
  }

  .bc-hero-dot{
    flex:0 0 21px;
    width:21px;
    height:21px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;

<script>
const BaoCaoApp = (() => {
  let staff = [];
  const BC_OLD_DEPARTMENTS = [
    'VỆ SINH MÔI TRƯỜNG',
    'ĐỒ VẢI',
    'GIÁM SÁT',
    'DỤNG CỤ',
    'VI PHẠM CHUNG'
  ];

  function ensureDepartmentOptions(extra) {
    const el = document.getElementById('bc-dept');
    if (!el) return;

    const current = el.value || '';
    const existing = Array.from(el.options).map(o => String(o.value || '').trim());

    (extra || []).forEach(v => {
      v = String(v || '').trim();
      if (!v) return;
      if (!existing.some(x => norm(x) === norm(v))) {
        const op = document.createElement('option');
        op.value = v;
        op.textContent = v;
        el.appendChild(op);
        existing.push(v);
      }
    });

    if (current) {
      const match = Array.from(el.options).find(o => norm(o.value) === norm(current));
      if (match) el.value = match.value;
    }
  }

  let picker = null;
  let eventBridgeInstalled = false;

  /*
   * V11.4 - Kênh lưu riêng cho Báo cáo.
   * Gọi thẳng google.script.run để không phụ thuộc AppUtil.server hoặc
   * danh sách hàm cho phép được khai báo ở một file HTML dùng chung khác.
   */
  function saveRpcErrorMessage(error) {
    if (!error) return 'Apps Script không trả thông tin lỗi.';
    return String(error.message || error.toString() || error);
  }

  function parseSavePacket(raw) {
    let packet;

    try {
      packet = typeof raw === 'string'
        ? JSON.parse(raw)
        : raw;
    } catch (e) {
      throw new Error(
        'API lưu trả dữ liệu không hợp lệ: ' +
        String(raw || '').slice(0, 300)
      );
    }

    if (!packet || packet.success !== true) {
      throw new Error(
        packet && packet.error
          ? packet.error
          : 'Apps Script không xác nhận lưu thành công.'
      );
    }

    return packet.data || {};
  }

  function runSaveRpc(invoke) {
    return new Promise((resolve, reject) => {
      try {
        const runner = google.script.run
          .withSuccessHandler(raw => {
            try {
              resolve(parseSavePacket(raw));
            } catch (e) {
              reject(e);
            }
          })
          .withFailureHandler(error => {
            reject(new Error(saveRpcErrorMessage(error)));
          });

        invoke(runner);
      } catch (e) {
        reject(e);
      }
    });
  }

  function reportDataRpc(action, payload) {
    return runSaveRpc(runner =>
      runner.bcReportDataV120Json({
        action: action,
        payload: payload || {}
      })
    );
  }

  function saveOpinionRpc(payload) {
    return reportDataRpc('SAVE_OPINION', payload);
  }

  function deleteOpinionRpc(payload) {
    return reportDataRpc('DELETE_OPINION', payload);
  }

  function saveIssueRpc(payload) {
    return reportDataRpc('SAVE_ISSUE', payload);
  }

  function getIssueRpc(id) {
    return reportDataRpc('GET_ISSUE', {id: id});
  }

  function pingStorageRpc() {
    return reportDataRpc('PING', {});
  }

  function bcLastDayOfCurrentMonth() {
    const now = new Date();
    const d = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  async function init() {
    installEventBridge();
    // Hiện Bộ phận ngay lập tức theo cấu trúc cũ, không phụ thuộc RPC.
    ensureDepartmentOptions([]);
    AppUtil.loading(true, 'Đang tải dữ liệu báo cáo...');
    try {
      await pingStorageRpc();

      const initText = await AppUtil.server('ksReportV3InitialJson');
      let initPacket;
      try {
        initPacket = JSON.parse(String(initText || ''));
      } catch (parseError) {
        throw new Error('API khởi tạo trả dữ liệu không hợp lệ: ' + String(initText || '').slice(0, 200));
      }
      if (!initPacket || !initPacket.success) {
        throw new Error((initPacket && initPacket.error) || 'Không khởi tạo được báo cáo.');
      }
      const d = initPacket.data || {};
      staff = Array.isArray(d.staff) ? d.staff : [];

      document.getElementById('bc-from').value = AppUtil.firstMonth();
      document.getElementById('bc-to').value = bcLastDayOfCurrentMonth();

      const reportDepartments = Array.isArray(d.departments) ? d.departments.slice() : [];
      staff.forEach(x => {
        const dep = String((x && x.department) || '').trim();
        if (dep) reportDepartments.push(dep);
      });
      ensureDepartmentOptions(reportDepartments);

      picker = SmartSelect.bind({
        input: 'bc-name',
        hidden: 'bc-person',
        menu: 'bc-menu',
        items: staff,
        label: x => x.name + (x.position ? ' (' + x.position + ')' : ''),
        value: x => x.name
      });

      document.getElementById('bc-name').addEventListener('input', function() {
        if (!String(this.value || '').trim()) {
          document.getElementById('bc-person').value = '';
        }
      });

      departmentChanged(false);
    } catch (e) {
      ensureDepartmentOptions([]);
      alert('Lỗi tải báo cáo: ' + e.message);
    } finally {
      AppUtil.loading(false);
    }
  }

  function departmentChanged(clearPerson = true) {
    const dep = document.getElementById('bc-dept').value;

    if (clearPerson) {
      document.getElementById('bc-name').value = '';
      document.getElementById('bc-person').value = '';
    }

    const items = dep
      ? staff.filter(x => norm(x.department) === norm(dep))
      : staff.slice();

    if (picker && picker.setItems) picker.setItems(items);
  }

  async function load() {
    const department = String(document.getElementById('bc-dept').value || '').trim();
    const visibleName = String(document.getElementById('bc-name').value || '').trim();
    let person = String(document.getElementById('bc-person').value || '').trim();

    // Không chọn nhân viên => lấy toàn bộ bộ phận.
    if (!visibleName) {
      person = '';
      document.getElementById('bc-person').value = '';
    }

    const filters = {
      from: document.getElementById('bc-from').value,
      to: document.getElementById('bc-to').value,
      department: department,
      person: person
    };

    AppUtil.loading(true, 'Đang tổng hợp báo cáo...');
    try {
      const reportText = await AppUtil.server('ksReportV3DepartmentJson', filters);

      let packet;
      try {
        packet = JSON.parse(String(reportText || ''));
      } catch (parseError) {
        throw new Error(
          'API V3 trả dữ liệu không phải JSON. Nội dung nhận được: ' +
          String(reportText || '').slice(0, 300)
        );
      }

      if (!packet || !packet.success) {
        throw new Error(
          (packet && packet.error)
            ? packet.error
            : 'API V3 không trả dữ liệu báo cáo.'
        );
      }

      const r = packet.data || {};

      if (!r.reportType) {
        throw new Error('Dữ liệu báo cáo thiếu reportType.');
      }

      render(r);
    } catch (e) {
      document.getElementById('bc-content').innerHTML =
        '<div class="alert alert-danger"><b>Lỗi API báo cáo:</b> ' + esc(e.message) + '</div>';
    } finally {
      AppUtil.loading(false);
    }
  }

  function render(r) {
    console.log('KS REPORT V3', r);
    if (!r || typeof r !== 'object') {
      document.getElementById('bc-content').innerHTML =
        '<div class="alert alert-danger"><b>Lỗi API báo cáo:</b> Không nhận được đối tượng dữ liệu hợp lệ.</div>';
      return;
    }

    if (r.reportType === 'SPECIAL') renderSpecial(r);
    else renderGeneric(r);
  }

  function renderGeneric(r) {
    const s = r.summary || {};

    let h =
      '<div class="bc-report">';

    h += reportHeader(
      'BÁO CÁO TỔNG HỢP ' +
      (
        r.filters.department ||
        'CÁC BỘ PHẬN'
      ),
      r.filters
    );

    h += metrics([
      [
        'Kế hoạch tuần',
        (s.weeklyDone || 0) +
        '/' +
        (s.weeklyTotal || 0)
      ],
      [
        'Kế hoạch tháng',
        (s.monthlyDone || 0) +
        '/' +
        (s.monthlyTotal || 0)
      ],
      [
        'Giao việc hoàn thành',
        (s.taskDone || 0) +
        '/' +
        (s.taskTotal || 0)
      ],
      [
        'Quá hạn',
        s.overdue || 0
      ],
      [
        'Tỷ lệ bảng kiểm',
        (s.checklistAvgRate || 0) +
        '%'
      ],
      [
        'Lỗi vi phạm',
        s.violationCount || 0
      ],
      [
        'Điểm trừ vi phạm',
        s.violationPoints || 0
      ],
      [
        'Tồn tại',
        s.issueCount || 0
      ]
    ]);

    h += section(
      '1. KẾ HOẠCH TUẦN CỦA BỘ PHẬN'
    ) +
    basicTable(
      [
        'Từ ngày',
        'Đến ngày',
        'Nội dung',
        'Người phụ trách',
        'Trạng thái',
        'Kết quả',
        'Ghi chú'
      ],
      r.weekly,
      [
        'from',
        'to',
        'content',
        'owner',
        'status',
        'result',
        'note'
      ]
    );

    h += section(
      '2. KẾ HOẠCH THÁNG CỦA BỘ PHẬN'
    ) +
    basicTable(
      [
        'Từ ngày',
        'Đến ngày',
        'Nội dung',
        'Người phụ trách',
        'Trạng thái',
        'Kết quả',
        'Ghi chú'
      ],
      r.monthly,
      [
        'from',
        'to',
        'content',
        'owner',
        'status',
        'result',
        'note'
      ]
    );

    h += section(
      '3. CÔNG VIỆC TRỌNG ĐIỂM & ĐỘT XUẤT'
    ) + taskPriorityReportTable(r.tasks);

    h += section(
      '4. PHÂN TÍCH BẢNG KIỂM'
    ) +
    basicTable(
      [
        'Ngày',
        'Nhân viên',
        'Phiếu',
        'Khu vực',
        'Tỷ lệ',
        'Không đạt',
        'Điểm KPI'
      ],
      r.checks,
      [
        'date',
        'name',
        'formName',
        'area',
        'rate',
        'fail',
        'kpi'
      ]
    );

    h += section(
      '5. THỐNG KÊ LỖI / VI PHẠM'
    ) +
    basicTable(
      [
        'Ngày',
        'Nhân viên',
        'Lỗi',
        'Điểm trừ'
      ],
      r.violations,
      [
        'date',
        'name',
        'errorName',
        'points'
      ]
    );

    /*
     * Để thống nhất toàn hệ thống,
     * MỤC 10 luôn là KẾ HOẠCH TUẦN SAU.
     */
    h += section(
      '10. DANH SÁCH KẾ HOẠCH TUẦN SAU'
    );

    h += nextWeekPlanBlock(
      r.nextWeekPlan
    );

    h += section(
      '11. TỒN TẠI / SỰ CỐ / KIẾN NGHỊ'
    ) +
    basicTable(
      [
        'Ngày',
        'Tồn tại',
        'Nguyên nhân',
        'Phương án',
        'Trạng thái'
      ],
      r.issues,
      [

  function cssdDailyChart(daily) {
    daily = Array.isArray(daily)
      ? daily
      : [];

    if (!daily.length) {
      return (
        '<div class="cssd-chart-card">' +
          '<div class="cssd-chart-title">SẢN LƯỢNG XỬ LÝ DỤNG CỤ THEO NGÀY</div>' +
          '<div class="text-center text-muted p-4">Không có dữ liệu theo ngày.</div>' +
        '</div>'
      );
    }

    const maxValue = Math.max(
      1,
      ...daily.map(
        x => Number(x.total || 0)
      )
    );

    const bars = daily.map(
      x => {
        const value =
          Number(x.total || 0);

        const height =
          Math.max(
            2,
            Math.round(
              value *
              165 /
              maxValue
            )
          );

        const weekday =
          cssdWeekdayLabel(
            x.date
          );

        return (
          '<div class="cssd-bar-item">' +
            '<div class="cssd-bar-value">' +
              esc(value) +
            '</div>' +

            '<div class="cssd-bar-wrap">' +
              '<div class="cssd-bar" style="height:' +
                height +
                'px" title="' +
                esc(weekday + ': ' + value + ' bộ') +
              '"></div>' +
            '</div>' +

            '<div class="cssd-bar-label">' +
              esc(weekday) +
            '</div>' +

            '<div class="cssd-bar-date">' +
              esc(x.date || '') +
            '</div>' +
          '</div>'
        );
      }
    ).join('');

    return (
      '<div class="cssd-chart-card">' +
        '<div class="cssd-chart-title">' +
          'SẢN LƯỢNG XỬ LÝ DỤNG CỤ THEO NGÀY' +
        '</div>' +

        '<div class="cssd-bar-chart">' +
          bars +
        '</div>' +
      '</div>'
    );
  }


  function cssdWeekdayLabel(
    ddmmyyyy
  ) {
    const p =
      String(
        ddmmyyyy || ''
      ).split('/');

    if (p.length !== 3) {
      return String(
        ddmmyyyy || ''
      );
    }

    const d =
      new Date(
        Number(p[2]),
        Number(p[1]) - 1,
        Number(p[0])
      );

    if (
      isNaN(
        d.getTime()
      )
    ) {
      return String(
        ddmmyyyy || ''
      );
    }

    const labels = [
      'Chủ nhật',
      'Thứ 2',
      'Thứ 3',
      'Thứ 4',
      'Thứ 5',
      'Thứ 6',
      'Thứ 7'
    ];

    return labels[
      d.getDay()
    ];
  }

  function signedNumber(value) {
    const n =
      Number(value || 0);

    if (n > 0) {
      return '+' + n;
    }

    return String(n);
  }


  function scoreCell(value) {
    const n =
      Number(value || 0);

    const cls =
      n > 0
        ? 'bc-score-positive'
        : (
            n < 0
              ? 'bc-score-negative'
              : 'bc-score-zero'
          );

    return (
      '<td class="' +
        cls +
      '">' +
        esc(
          signedNumber(n)
        ) +
      '</td>'
    );
  }


  function officialRankBadge(rank,color) {
    const r=
      String(
        rank || ''
      ).trim();

    const bg=
      color ||
      '#6C757D';

    return (
      '<span class="bc-rank-chip" style="background:'+
        esc(bg)+
        ';color:#fff;border-color:'+
        esc(bg)+
      '">'+
        esc(r)+
      '</span>'
    );
  }


  function dynamicRankSummary(config,counts) {
    config=
      Array.isArray(config)
        ? config
        : [];

    counts=
      counts || {};

    if(!config.length){
      const keys=Object.keys(counts);

      if(!keys.length){
        return '';
      }

      config=keys.map(k=>({
        ranking:k,
        color:'#6C757D'
      }));
    }

    return (
      '<div class="bc-kpi-rank-grid">' +
        config.map(x=>
          '<div class="bc-kpi-rank-card" style="background:'+
            esc(x.color||'#6C757D')+
            ';color:#fff">'+
            esc(x.ranking||'')+
            '<strong>'+
              esc(counts[x.ranking]||0)+
            '</strong>'+
          '</div>'
        ).join('') +
      '</div>'
    );
  }


  function kpiChartOfficial(rows) {
    rows =
      Array.isArray(rows)
        ? rows
        : [];

    if (!rows.length) {
      return '';
    }

    const maxScore =
      Math.max(
        120,
        ...rows.map(
          x =>
            Number(
              x.total || 0
            )
        )
      );

    return (
      '<div class="bc-kpi-chart">' +
        '<div class="bc-kpi-chart-title">' +
          'BIỂU ĐỒ ĐIỂM KPI 100 ĐIỂM CỦA NHÂN VIÊN' +
        '</div>' +

        rows.map(x => {
          const score =
            Number(
              x.total || 0
            );

          const width =
            Math.max(
              0,
              Math.min(
                100,
                score *
                100 /
                maxScore
              )
            );

          const barColor =
            (
              x.rankingColor ||
              rankBarColor(
                x.ranking
              )
            );

          return (
            '<div class="bc-kpi-row">' +
              '<div class="bc-kpi-name">' +
                esc(x.name || '') +
              '</div>' +

              '<div class="bc-kpi-track">' +
                '<div class="bc-kpi-bar" style="width:' +
                  width +
                  '%;background:' +
                  barColor +
                '"></div>' +
              '</div>' +

              '<div class="bc-kpi-value">' +
                score.toFixed(1) +
              '</div>' +
            '</div>'
          );
        }).join('') +
      '</div>'
    );
  }


  function rankBarColor(rank) {
    const r =
      String(
        rank || ''
      ).toUpperCase();

    if (r === 'XUẤT SẮC') {
      return '#2563eb';
    }

    if (r === 'TỐT') {
      return '#16a34a';
    }

    if (r === 'KHÁ') {
      return '#0891b2';
    }

    if (r === 'TRUNG BÌNH') {
      return '#f59e0b';
    }

    return '#dc2626';
  }

  function reportWeekLabel(
    ymd
  ) {
    if (!ymd) {
      return '';
    }

    const d =
      new Date(
        ymd +
        'T00:00:00'
      );

    if (
      isNaN(
        d.getTime()
      )
    ) {
      return '';
    }

    /*
     * ISO week number.
     */
    const date =
      new Date(
        Date.UTC(
          d.getFullYear(),
          d.getMonth(),
          d.getDate()
        )
      );

    const dayNum =
      date.getUTCDay() ||
      7;

    date.setUTCDate(
      date.getUTCDate() +
      4 -
      dayNum
    );

    const yearStart =
      new Date(
        Date.UTC(
          date.getUTCFullYear(),
          0,
          1
        )
      );

    const week =
      Math.ceil(
        (
          (
            date -
            yearStart
          ) /
          86400000 +
          1
        ) /
        7
      );

    return (
      'TUẦN ' +
      week
    );
  }

  function bcRowKind(row) {
    if (!row) return '';
    if (row.kind) return row.kind;
    if (row.assignee !== undefined && row.evalStatus !== undefined) return 'TASK';
    if (row.type === 'WEEK' || row.type === 'MONTH') return 'PLAN';
    if (row.errorName !== undefined) return 'VIOLATION';
    if (row.issue !== undefined) return 'ISSUE';
    return '';
  }

  function bcStatusOptions(kind, current) {
    let a = [];
    if (kind === 'TASK') a=['CHƯA BẮT ĐẦU','ĐANG LÀM','HOÀN THÀNH','QUÁ HẠN'];
    else if (kind === 'PLAN') a=['CHƯA BẮT ĐẦU','ĐANG THỰC HIỆN','HOÀN THÀNH','QUÁ HẠN','CHUYỂN TIẾP'];
    else if (kind === 'VIOLATION') a=['Chưa xử lý','Đang xử lý','Đã xử lý'];
    else if (kind === 'ISSUE') a=['CHƯA KHẮC PHỤC','ĐANG XỬ LÝ','ĐÃ KHẮC PHỤC','QUÁ HẠN'];
    if (current && !a.includes(current)) a.unshift(current);
    return a;
  }

  function basicCellHtml(key,value,row) {
    const kind=bcRowKind(row);
    const id=String((row&&row.id)||'');
    if(String(key||'').toLowerCase()==='status' && kind && id){
      const opts=bcStatusOptions(kind,String(value||''));
      return '<select class="form-select form-select-sm bc-colored-select '+bcColorClass(value)+'" onchange="this.className=\'form-select form-select-sm bc-colored-select \'+bcColorClass(this.value);BaoCaoApp.inlineSave(this)" data-kind="'+esc(kind)+'" data-id="'+esc(id)+'" data-plan-type="'+esc(row.type||row.planType||'')+'" data-field="status">' +
        opts.map(x=>'<option '+(String(x)===String(value)?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select>';
    }
    if(kind==='TASK' && key==='evalStatus' && id){
      const opts=['CHƯA BẮT ĐẦU','XUẤT SẮC','TỐT','KHÁ','CHƯA ĐẠT','KÉM','QUÁ HẠN'];
      return '<select class="form-select form-select-sm bc-colored-select '+bcColorClass(value)+'" onchange="this.className=\'form-select form-select-sm bc-colored-select \'+bcColorClass(this.value);BaoCaoApp.inlineSave(this)" data-kind="TASK" data-id="'+esc(id)+'" data-field="evalStatus">'+
        opts.map(x=>'<option '+(String(x)===String(value)?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select>';
    }
    if((key==='managerNote' || (kind==='PLAN' && key==='note')) && id){
      return '<textarea class="form-control form-control-sm" rows="2" onblur="BaoCaoApp.inlineSave(this)" data-kind="'+esc(kind)+'" data-id="'+esc(id)+'" data-plan-type="'+esc(row.type||row.planType||'')+'" data-field="note">'+esc(value||'')+'</textarea>';
    }
    if(key==='imageRef' && value){
      return '<button class="btn btn-outline-primary btn-sm" data-bc-image-ref="' + esc(encodeURIComponent(String(value))) + '" onclick="BaoCaoApp.openReportImage(this.dataset.bcImageRef)">Xem ảnh</button>';
    }
    return esc(value == null ? '' : value);
  }


  function bcColorClass(value){
    const n=norm(value);
    if(n.includes('qua han') || n.includes('kem') || n.includes('chua dat')) return 'bc-c-red';
    if(n.includes('hoan thanh') || n.includes('xuat sac') || n==='tot' || n.includes('da xu ly') || n.includes('da khac phuc')) return 'bc-c-green';
    if(n.includes('dang')) return 'bc-c-blue';
    if(n==='kha' || n.includes('sap')) return 'bc-c-yellow';
    return 'bc-c-gray';
  }

  function reportStatusBadge(status) {
    const raw=
      String(
        status || ''
      ).trim();

    if(!raw){
      return '';
    }

    const s=
      norm(raw);

    let cls=
      'bc-status-new';

    if(
      s.includes('hoan thanh') ||
      s.includes('da khac phuc') ||
      s.includes('da xu ly') ||
      s.includes('dong')
    ){
      cls='bc-status-done';

    }else if(
      s.includes('qua han')
    ){
      cls='bc-status-overdue';

    }else if(
      s.includes('dang lam') ||
      s.includes('dang xu ly') ||
      s.includes('dang khac phuc') ||
      s.includes('dang thuc hien')
    ){
      cls='bc-status-doing';

    }else if(
      s.includes('chua bat dau') ||
      s.includes('chua xu ly') ||
      s.includes('chua khac phuc') ||
      s.includes('chua thuc hien')
    ){
      cls='bc-status-new';

    }else{
      cls='bc-status-warning';
    }

    return (
      '<span class="bc-status '+
        cls+
      '">'+
        esc(raw)+
      '</span>'
    );
  }

  async function openImage(ref) {
    if (!ref) return;

    const modal = document.getElementById('bc-image-modal');
    const img = document.getElementById('bc-image-view');
    const loading = document.getElementById('bc-image-loading');

    img.style.display = 'none';
    img.removeAttribute('src');
    loading.style.display = 'block';
    modal.classList.add('show');

    try {
      const dataUrl = await AppUtil.server('getImageDataUrl', ref);
      if (!dataUrl) throw new Error('Không đọc được ảnh từ Drive.');
      img.src = dataUrl;
      img.style.display = 'block';
      loading.style.display = 'none';
    } catch (e) {
      loading.textContent = 'Không tải được ảnh: ' + e.message;
    }
  }

    document.getElementById('bc-image-modal').classList.remove('show');

  function formatYmd(v) {
    if (!v) return '';
    const p = String(v).split('-');
    return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : v;
  }

  function norm(v) {
    return String(v || '')
      .trim()
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/đ/g, 'd');
  }

  function esc(v) {
    return String(v ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function jsq(v) {
    return String(v ?? '')
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/\r/g, '')
      .replace(/\n/g, '\\n');
  }

  /*
   * Tạo thuộc tính onclick hợp lệ cho HTML dựng động.
   * JSON.stringify dùng dấu ngoặc kép; nếu ghép thẳng vào onclick="..."
   * thì trình duyệt đóng thuộc tính quá sớm và nút bấm không chạy.
   * esc() chuyển dấu nháy thành HTML entity trước khi đưa vào thuộc tính.
   */
  function actionAttr(method, args) {
    const safeMethod = String(method || '')
      .replace(/[^a-zA-Z0-9_$]/g, '');

    const code =
      'BaoCaoApp.' +
      safeMethod +
      '(' +
      (args || []).map(x => JSON.stringify(x)).join(',') +
      ')';

    return 'onclick="' + esc(code) + '"';
  }


  function dataActionAttr(action, values) {
    let out =
      'data-bc-action="' +
      esc(action || '') +
      '"';

    Object.keys(values || {}).forEach(key => {
      const htmlKey = String(key)
        .replace(/([A-Z])/g, '-$1')
        .toLowerCase();

      out +=
        ' data-bc-' +
        htmlKey +
        '="' +
        esc(values[key] ?? '') +
        '"';
    });

    return out;
  }

    detail
  ) {

      );

    if (!box) {
      return;

    const icon =
      document.getElementById(
        'bc-save-feedback-icon'
      );

    const titleEl =
      document.getElementById(
        'bc-save-feedback-title'
      );

    const detailEl =
      document.getElementById(

      );

    box.className =
      'bc-save-feedback no-print show ' +
      (
        type ||
        'success'
      );

    if (icon) {

        type === 'error'
          ? '❌'
          : (
              type === 'info'
                ? 'ℹ️'

    if (titleEl) {

  async function saveOpinion(
    formCode,
    formName,
    textareaId,
    statusId,
    metaId,
    editBtnId,
    saveBtnId,
    cancelBtnId,
    deleteBtnId
  ) {
    const el =
      document.getElementById(
        textareaId
      );

    if (!el) {
      return alert(
        'Không tìm thấy ô ý kiến.'
      );
    }

    const payload = {
      from:
        document.getElementById(
          'bc-from'
        ).value,

      to:
        document.getElementById(
          'bc-to'
        ).value,

      department:
        document.getElementById(
          'bc-dept'
        ).value,

      person:
        document.getElementById(
          'bc-person'
        ).value,

      formCode:
        formCode ||
        '__TONG_THE__',

      formName:
        formName || '',

      opinion:
        el.value.trim()
    };

    if (
      !payload.from ||
      !payload.to
    ) {
      return alert(
        'Phải chọn Từ ngày và Đến ngày.'
      );
    }

    if (!payload.department) {
      return alert(
        'Phải chọn Bộ phận trước khi lưu ý kiến.'
      );
    }

    if (!payload.opinion) {
      return alert(
        'Nội dung ý kiến đang trống. Nếu muốn bỏ nội dung đã lưu, hãy dùng nút XÓA NỘI DUNG.'
      );
    }

    const wasSaved =
      el.dataset.opinionSaved ===
      '1';

    if (
      !confirm(
        wasSaved
          ? (
              'Cập nhật ý kiến cho kỳ ' +
              payload.from +
              ' → ' +
              payload.to +
              '?'
            )
          : (
              'Lưu ý kiến cho kỳ ' +
              payload.from +
              ' → ' +
              payload.to +
              '?'
            )
      )
    ) {
      return;
    }

    AppUtil.loading(
      true,
      wasSaved
        ? 'Đang cập nhật ý kiến khắc phục...'
        : 'Đang lưu ý kiến khắc phục...'
    );

    try {
      const r = await saveOpinionRpc(payload);

      el.dataset.opinionSaved='1';
      el.dataset.originalOpinion=
        payload.opinion;

      el.readOnly=true;
      el.classList.remove(
        'editing'
      );

      const statusEl =
        document.getElementById(
          statusId
        );

      if (statusEl) {
        statusEl.className=
          'bc-opinion-status saved';

        statusEl.textContent=
          '✅ Nội dung đã được lưu. Khi mở lại đúng kỳ báo cáo, hệ thống sẽ tự nạp lại. Có thể bấm SỬA / BỔ SUNG để chỉnh tiếp.';
      }

      const metaEl =
        document.getElementById(
          metaId
        );

      if (metaEl) {
        metaEl.textContent=
          'Đã lưu cho kỳ ' +
          payload.from +
          ' → ' +
          payload.to +
          '. Cập nhật gần nhất: ' +
          (
            r.updatedAt || ''
          ) +
          (
            r.author
              ? ' — ' +
                r.author
              : ''
          ) +
          (
            r.revision
              ? ' — Lần cập nhật ' +
                r.revision
              : ''
          );
      }

      const editBtn =
        document.getElementById(
          editBtnId
        );

      const saveBtn =
        document.getElementById(
          saveBtnId
        );

      const cancelBtn =
        document.getElementById(
          cancelBtnId
        );

      const deleteBtn =
        document.getElementById(
          deleteBtnId
        );

      if (editBtn) {
        editBtn.style.display='';
      }

      if (saveBtn) {
        saveBtn.style.display='none';
        saveBtn.textContent=
          '💾 CẬP NHẬT Ý KIẾN';
        saveBtn.classList.remove(
          'btn-primary'
        );
        saveBtn.classList.add(
          'btn-success'
        );
      }

      if (cancelBtn) {
        cancelBtn.style.display='none';
      }

      if (deleteBtn) {
        deleteBtn.style.display='';
      }

      alert(
        (
          r &&
          r.message
        ) ||
        (
          wasSaved
            ? 'Đã cập nhật ý kiến.'
            : 'Đã lưu ý kiến.'
        )
      );

      /*
       * Load lại báo cáo:
       * bảo đảm mở lại đúng kỳ sẽ đọc từ Google Sheets.
       */
      await load();

      showSaveFeedback(
        'success',
        wasSaved
          ? '✅ ĐÃ CẬP NHẬT Ý KIẾN THÀNH CÔNG'
          : '✅ ĐÃ LƯU Ý KIẾN THÀNH CÔNG',
        'Kỳ báo cáo '+
        payload.from+
        ' → '+
        payload.to+
        ' · Bộ phận: '+
        payload.department+
        (
          r && r.revision
            ? ' · Lần cập nhật: '+r.revision
            : ''
        )+
        ' · '+localDateTimeText()
      );

    } catch(e) {
      showSaveFeedback(
        'error',
        '❌ LƯU Ý KIẾN KHÔNG THÀNH CÔNG',
        e.message
      );

      alert(
        'Không thể lưu/cập nhật ý kiến: ' +
        e.message
      );

    } finally {
      AppUtil.loading(false);
    }
  }

  function installEventBridge() {
    if (eventBridgeInstalled) return;
    eventBridgeInstalled = true;

    document.addEventListener('click', function(event) {
      const target = event.target && event.target.closest
        ? event.target.closest('[data-bc-action]')
        : null;

      if (!target) return;

      const d = target.dataset || {};
      const action = d.bcAction || '';

      event.preventDefault();
      event.stopPropagation();

      if (action === 'toggle-issue') {
        toggleIssueEntry(d.bcPrefix || '');
        return;
      }

      if (action === 'save-issue') {
        saveIssueEntry(d.bcType || '');
        return;
      }

      if (action === 'edit-issue') {
        editIssueEntry(d.bcId || '');
        return;
      }

      if (action === 'cancel-issue') {
        cancelIssueEdit(d.bcType || '');
        return;
      }

      if (action === 'edit-opinion') {
        editOpinion(
          d.bcTextareaId,
          d.bcEditBtnId,
          d.bcSaveBtnId,
          d.bcCancelBtnId
        );
        return;
      }

      if (action === 'cancel-opinion') {
        cancelEditOpinion(
          d.bcTextareaId,
          d.bcEditBtnId,
          d.bcSaveBtnId,
          d.bcCancelBtnId
        );
        return;
      }

      if (action === 'save-opinion') {
        saveOpinion(
          d.bcFormCode,
          d.bcFormName,
          d.bcTextareaId,
          d.bcStatusId,
          d.bcMetaId,
          d.bcEditBtnId,
          d.bcSaveBtnId,
          d.bcCancelBtnId,
          d.bcDeleteBtnId
        );
        return;
      }

      if (action === 'delete-opinion') {
        deleteOpinion(
          d.bcFormCode,
          d.bcFormName
        );
      }
    });
  }


  async function editIssueEntry(id) {
    if (!id) {
      return alert('Không tìm thấy mã bản ghi cần sửa.');
    }

    AppUtil.loading(true, 'Đang mở dữ liệu để sửa...');

    try {
      const item = await getIssueRpc(id);
      const incident = item.type === 'SU_CO';
      const prefix = incident ? 'bc-inc' : 'bc-other';

      const setVal = (suffix, value) => {
        const el = document.getElementById(prefix + '-' + suffix);
        if (el) el.value = value || '';
      };

      setVal('id', item.id);
      setVal('date', item.date);
      setVal('department', item.department);
      setVal('owner', item.owner);
      setVal('deadline', item.deadline);
      setVal('issue', item.issue);
      setVal('cause', item.cause);
      setVal('action', item.action);
      setVal('status', item.status);
      setVal('recommendation', item.recommendation);
      setVal('note', item.note);

      const body = document.getElementById(prefix + '-body');
      if (body) body.style.display = 'block';

      const saveBtn = document.getElementById(prefix + '-save-btn');
      if (saveBtn) {
        saveBtn.textContent = incident
          ? '💾 CẬP NHẬT NHẬT KÝ SỰ CỐ'
          : '💾 CẬP NHẬT TỒN TẠI / KIẾN NGHỊ';
      }

      const cancelBtn = document.getElementById(prefix + '-cancel-btn');
      if (cancelBtn) cancelBtn.style.display = '';

      const statusBox = document.getElementById(prefix + '-save-status');
      if (statusBox) {
        statusBox.className = 'bc-entry-inline-status show success';
        statusBox.textContent = '✏️ Đang sửa bản ghi ' + item.id;
      }

      if (body && body.scrollIntoView) {
        body.scrollIntoView({behavior: 'smooth', block: 'start'});
      }
    } catch (e) {
      alert('Không thể mở dữ liệu để sửa: ' + e.message);
    } finally {
      AppUtil.loading(false);
    }
  }

  async function saveIssueEntry(type){
    const incident=
      type==='SU_CO';

    const prefix=
      incident
        ? 'bc-inc'
        : 'bc-other';

    const val=id=>{
      const el=
        document.getElementById(id);

      return el
        ? String(el.value||'').trim()
        : '';
    };

    const payload={
      id:val(prefix+'-id'),
      type:type,
      date:val(prefix+'-date'),
      department:
        val(prefix+'-department') ||
        document.getElementById('bc-dept').value,
      issue:val(prefix+'-issue'),
      cause:val(prefix+'-cause'),
      action:val(prefix+'-action'),
      owner:val(prefix+'-owner'),
      deadline:val(prefix+'-deadline'),
      status:val(prefix+'-status'),
      recommendation:
        incident
          ? ''
          : val(prefix+'-recommendation'),
      note:
        incident
          ? val(prefix+'-note')
          : ''
    };

    if(!payload.department){
      return alert(
        'Phải chọn Bộ phận trong bộ lọc báo cáo trước khi nhập.'
      );
    }

    if(!payload.issue){
      return alert(
        incident
          ? 'Phải nhập Nội dung sự cố.'
          : 'Phải nhập Tồn tại / Nội dung.'
      );
    }

    const saveBtn=
      document.getElementById(
        prefix+'-save-btn'
      );

    const statusBox=
      document.getElementById(
        prefix+'-save-status'
      );

    const originalText=
      saveBtn
        ? saveBtn.textContent
        : '';

    if(saveBtn){
      saveBtn.disabled=true;
      saveBtn.classList.add(
        'is-saving'
      );
      saveBtn.textContent=
        '⏳ ĐANG LƯU...';
    }

    if(statusBox){
      statusBox.className=
        'bc-entry-inline-status';
      statusBox.textContent='';
    }

    AppUtil.loading(
      true,
      incident
        ? 'Đang lưu nhật ký sự cố...'
        : 'Đang lưu tồn tại / kiến nghị...'
    );

    try{
      const r = await saveIssueRpc(payload);

      /*
       * Phản hồi NGAY tại nút trước khi tải lại.
       */
      if(saveBtn){
        saveBtn.classList.remove(
          'is-saving'
        );
        saveBtn.classList.add(
          'is-saved'
        );
        saveBtn.textContent=
          '✅ ĐÃ LƯU THÀNH CÔNG';
      }

      if(statusBox){
        statusBox.className=
          'bc-entry-inline-status show success';

        statusBox.textContent=
          (
            incident
              ? '✅ Nhật ký sự cố đã được lưu.'
              : '✅ Tồn tại / Kiến nghị đã được lưu.'
          )+
          (
            r && r.id
              ? ' Mã: '+r.id+'.'
              : ''
          )+
          ' '+localDateTimeText();
      }

      alert(
        (
          r &&
          r.message
        ) ||
        'Đã lưu thành công.'
      );

      /*
       * Tải lại đúng bộ lọc hiện tại:
       * bản ghi mới xuất hiện trong Mục 10/11 nếu ngày nằm trong kỳ.
       */
      await load();

      /*
       * Thông báo này nằm NGOÀI bc-content,
       * nên vẫn còn sau khi load() dựng lại báo cáo.
       */
      showSaveFeedback(
        'success',
        incident
          ? (
              r && r.mode === 'UPDATE'
                ? '✅ MỤC 10 — ĐÃ CẬP NHẬT NHẬT KÝ SỰ CỐ'
                : '✅ MỤC 10 — ĐÃ LƯU NHẬT KÝ SỰ CỐ'
            )
          : (
              r && r.mode === 'UPDATE'
                ? '✅ MỤC 11 — ĐÃ CẬP NHẬT TỒN TẠI / KIẾN NGHỊ'
                : '✅ MỤC 11 — ĐÃ LƯU TỒN TẠI / KIẾN NGHỊ'
            ),
        (
          r && r.id
            ? 'Mã bản ghi: '+r.id+' · '
            : ''
        )+
        'Ngày: '+
        payload.date+
        ' · Bộ phận: '+
        payload.department+
        ' · '+localDateTimeText()
      );

    }catch(e){
      if(saveBtn){
        saveBtn.disabled=false;
        saveBtn.classList.remove(
          'is-saving',
          'is-saved'
        );
        saveBtn.textContent=
          originalText;
      }

      if(statusBox){
        statusBox.className=
          'bc-entry-inline-status show';

        statusBox.style.background=
          '#fff1f2';

        statusBox.style.color=
          '#b42332';

        statusBox.style.border=
          '1px solid #f2a5ae';

        statusBox.textContent=
          '❌ Lưu không thành công: '+
          e.message;
      }

      showSaveFeedback(
        'error',
        incident
          ? '❌ MỤC 10 — LƯU KHÔNG THÀNH CÔNG'
          : '❌ MỤC 11 — LƯU KHÔNG THÀNH CÔNG',
        e.message
      );

      alert(
        'Không thể lưu: '+
        e.message
      );

    }finally{
      AppUtil.loading(false);

      /*
       * Nếu load() không chạy vì lỗi, trả nút về trạng thái thao tác.
       * Nếu thành công, DOM cũ đã được thay bằng load().
       */
      if(
        saveBtn &&
        document.body.contains(
          saveBtn
        ) &&
        !saveBtn.classList.contains(
          'is-saved'
        )
      ){
        saveBtn.disabled=false;
        saveBtn.classList.remove(
          'is-saving'
        );
        saveBtn.textContent=
          originalText;
      }
    }
  }


  async function inlineSave(el){
    if(!el || !el.dataset) return;
    const payload={
      kind:el.dataset.kind||'',
      id:el.dataset.id||'',
      planType:el.dataset.planType||''
    };
    payload[el.dataset.field||'status']=el.value;
    try{
      el.disabled=true;
      await AppUtil.server('bcInlineUpdateV20',payload);
      el.classList.add('border-success');
      setTimeout(()=>el.classList.remove('border-success'),900);
    }catch(e){
      alert('Không lưu được: '+e.message);
    }finally{el.disabled=false;}
  }

  async function openReportImage(encoded){

      const data=await AppUtil.server('getImageDataUrl',ref);

  function refreshSectionPicker(){

    const root=document.getElementById('bc-content');
    if(!box||!root)return;
    const sections=Array.from(root.querySelectorAll('.bc-section'));
    box.innerHTML=sections.map((el,i)=>
      '<label class="form-check form-check-inline m-0"><input class="form-check-input bc-section-check" type="checkbox" value="'+i+'" checked> <span class="form-check-label">'+esc(el.textContent.trim())+'</span></label>'
    ).join('');
    box.querySelectorAll('.bc-section-check').forEach(ch=>ch.addEventListener('change',applySectionVisibility));
  }

  function applySectionVisibility(){
    const root=document.getElementById('bc-content');
    if(!root)return;
    const sections=Array.from(root.querySelectorAll('.bc-section'));
    const checks=Array.from(document.querySelectorAll('.bc-section-check'));
    sections.forEach((sec,i)=>{
      const show=!checks[i] || checks[i].checked;
      sec.style.display=show?'':'none';
      let n=sec.nextElementSibling;
      while(n && !n.classList.contains('bc-section')){
        n.style.display=show?'':'none';
        n=n.nextElementSibling;
      }
    });
  }

  return {
    init,
    inlineSave,
    openReportImage,
    load,
    departmentChanged,
    openImage,
    closeImage,
    saveOpinion,
    editOpinion,
    cancelEditOpinion,
    deleteOpinion,
    showSaveFeedback,
    hideSaveFeedback,
    toggleIssueEntry,
    saveIssueEntry
  };
})();

/* Bảo đảm các onclick sinh động luôn tìm thấy BaoCaoApp trên window. */
window.BaoCaoApp = BaoCaoApp;
</script>
